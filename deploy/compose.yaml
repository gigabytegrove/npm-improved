# Portable image-only deployment; see DOCKER.md for host updater and compatibility notes.
name: npm-improved

services:
  app:
    image: ${NPM_IMAGE:-ghcr.io/gigabytegrove/npm-improved:v1.8.0}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${ADMIN_PORT:-81}:81"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Etc/UTC}
      DB_SQLITE_FILE: /data/database.sqlite
      NPM_ADMIN_PORT: "81"
      NPM_NODE_HOSTNAME: ${NPM_NODE_HOSTNAME:-}
      NPM_HOST_LAN_IP: ${NPM_HOST_LAN_IP:-}
      NPM_DEPLOYMENT_MODE: sqlite
      DISABLE_IPV6: ${DISABLE_IPV6:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      NPM_BACKUP_PASSPHRASE: ${NPM_BACKUP_PASSPHRASE:-}
      NPM_BACKUP_SCOPE: ${NPM_BACKUP_SCOPE:-disaster-recovery}
      NPM_BACKUP_INTERVAL_HOURS: ${NPM_BACKUP_INTERVAL_HOURS:-24}
      NPM_BACKUP_RETENTION: ${NPM_BACKUP_RETENTION:-7}
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  firewall:
    image: ${NPM_FIREWALL_IMAGE:-ghcr.io/gigabytegrove/npm-improved-firewall:v1.8.0}
    restart: unless-stopped
    # NET_ADMIN applies only in the app network namespace, never the host.
    network_mode: "service:app"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    # Match the NPMi runtime group: no CAP_DAC_OVERRIDE required.
    group_add:
      - "${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./data/instance-security/firewall:/policy
    depends_on:
      app:
        condition: service_started
