name: npm-improved

services:
  app:
    image: npm-improved:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_VERSION: ${NPM_BUILD_VERSION:-local}
        BUILD_COMMIT: ${NPM_BUILD_COMMIT:-unknown}
        BUILD_DATE: ${NPM_BUILD_DATE:-unknown}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${ADMIN_PORT:-81}:81"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Etc/UTC}
      DB_SQLITE_FILE: /data/database.sqlite
      NPM_ADMIN_PORT: "81"
      DISABLE_IPV6: ${DISABLE_IPV6:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      NPM_BACKUP_PASSPHRASE: ${NPM_BACKUP_PASSPHRASE:-}
      NPM_BACKUP_SCOPE: ${NPM_BACKUP_SCOPE:-disaster-recovery}
      NPM_BACKUP_INTERVAL_HOURS: ${NPM_BACKUP_INTERVAL_HOURS:-24}
      NPM_BACKUP_RETENTION: ${NPM_BACKUP_RETENTION:-7}
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
