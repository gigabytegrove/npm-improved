name: npm-improved

services:
  app:
    image: ${NPM_IMAGE:-npm-improved:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_VERSION: ${NPM_BUILD_VERSION:-local}
        BUILD_COMMIT: ${NPM_BUILD_COMMIT:-unknown}
        BUILD_DATE: ${NPM_BUILD_DATE:-unknown}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${ADMIN_PORT:-81}:81"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NPM_ADMIN_PORT: "81"
      NPM_HOST_PROJECT_DIR: ${NPM_HOST_PROJECT_DIR:-}
      NPM_DEPLOYMENT_MODE: ${NPM_DEPLOYMENT_MODE:-postgres}
      DISABLE_IPV6: ${DISABLE_IPV6:-false}
      DB_POSTGRES_HOST: db
      DB_POSTGRES_PORT: "5432"
      DB_POSTGRES_NAME: ${POSTGRES_DB:-npm}
      DB_POSTGRES_USER: ${POSTGRES_USER:-npm}
      DB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      NPM_BACKUP_PASSPHRASE: ${NPM_BACKUP_PASSPHRASE:-}
      NPM_BACKUP_SCOPE: ${NPM_BACKUP_SCOPE:-disaster-recovery}
      NPM_BACKUP_INTERVAL_HOURS: ${NPM_BACKUP_INTERVAL_HOURS:-24}
      NPM_BACKUP_RETENTION: ${NPM_BACKUP_RETENTION:-7}
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npm}
      POSTGRES_USER: ${POSTGRES_USER:-npm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npm} -d ${POSTGRES_DB:-npm}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
