name: Required Checks

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/npm-improved-control-plane .

      - name: Validate repository protection assets
        working-directory: .
        run: |
          bash -n scripts/apply-repository-rulesets.sh
          jq empty .github/rulesets/*.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Yarn
        working-directory: .
        run: npm install --global yarn@1.22.22

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Backend tests
        working-directory: backend
        run: yarn test

      - name: Backend lint
        working-directory: backend
        run: yarn lint

      - name: Validate API schema
        working-directory: backend
        run: yarn validate-schema

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend tests
        working-directory: frontend
        run: yarn test --run

      - name: Frontend lint
        working-directory: frontend
        run: yarn lint

      - name: Frontend build
        working-directory: frontend
        run: yarn build

      - name: Report inherited locale completeness gaps
        continue-on-error: true
        working-directory: frontend
        run: node check-locales.cjs
