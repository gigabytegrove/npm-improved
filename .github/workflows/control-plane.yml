name: Required Checks

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/npm-improved-control-plane .

      - name: Validate repository protection assets
        working-directory: .
        run: |
          bash -n scripts/apply-repository-rulesets.sh
          jq empty .github/rulesets/*.json
