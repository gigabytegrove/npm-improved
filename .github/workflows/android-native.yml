name: NPMi Native Android CI
on:
  push:
    branches: [develop, feature/native-android-foundation]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Unit tests and build
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK and version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts
          APK="app/build/outputs/versioned/NPMi-Android-v${VERSION}-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          (cd app/build/outputs/versioned && sha256sum "NPMi-Android-v${VERSION}-debug.apk" > SHA256SUMS)
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NPMi-Android-v0.1.0-alpha.1-debug
          path: |
            android/app/build/outputs/versioned/*.apk
            android/app/build/outputs/versioned/SHA256SUMS
          if-no-files-found: error
