name: Docker

on:
  pull_request:
    branches:
      - develop
    paths:
      - "docker/**"
      - "frontend/**"
      - "backend/**"
      - "controlplane/**"
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.example"
      - "DOCKER.md"
      - "scripts/install-docker"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - "docker/**"
      - "frontend/**"
      - "backend/**"
      - "controlplane/**"
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.example"
      - "DOCKER.md"
      - "scripts/install-docker"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare validation environment
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-mysql-password/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-mysql-root-password/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=18080/' .env
          sed -i 's/^ADMIN_PORT=.*/ADMIN_PORT=18081/' .env
          sed -i 's/^HTTPS_PORT=.*/HTTPS_PORT=18443/' .env

      - name: Validate installer shell
        run: bash -n scripts/install-docker

      - name: Validate installer preflight
        run: ./scripts/install-docker sqlite --check-only

      - name: Validate SQLite Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Validate MariaDB Compose
        run: docker compose -f compose.mysql.yaml config --quiet

      - name: Validate PostgreSQL Compose
        run: docker compose -f compose.postgres.yaml config --quiet

      - name: Build production image
        run: docker build --pull --progress=plain -f docker/Dockerfile -t npm-improved:local .

      - name: Smoke test SQLite to MySQL to SQLite migration
        run: |
          set -Eeuo pipefail

          docker compose -f compose.mysql.yaml up -d db
          db_id="$(docker compose -f compose.mysql.yaml ps -q db)"
          for _ in $(seq 1 90); do
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$db_id")"
            if [ "$state" = "healthy" ]; then
              break
            fi
            if [ "$state" = "unhealthy" ] || [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              docker compose -f compose.mysql.yaml logs db
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$db_id")" = "healthy"

          mkdir -p ci-migrate/data ci-migrate/letsencrypt
          docker run -d             --name npmi-migrate             --network npm-improved_default             -p 18081:81             -e INITIAL_ADMIN_EMAIL=ci@example.com             -e INITIAL_ADMIN_PASSWORD=ci-admin-password             -v "$PWD/ci-migrate/data:/data"             -v "$PWD/ci-migrate/letsencrypt:/etc/letsencrypt"             npm-improved:local

          for _ in $(seq 1 90); do
            if docker exec npmi-migrate /usr/bin/check-health >/dev/null 2>&1; then
              break
            fi
            state="$(docker inspect --format '{{.State.Status}}' npmi-migrate)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              docker logs npmi-migrate
              exit 1
            fi
            sleep 2
          done
          docker exec npmi-migrate /usr/bin/check-health

          token="$(curl -fsS             -H 'Content-Type: application/json'             -d '{"identity":"ci@example.com","secret":"ci-admin-password"}'             http://127.0.0.1:18081/api/tokens | jq -r '.token')"
          test -n "$token"
          test "$token" != "null"

          mysql_target='{"engine":"mysql","host":"db","port":3306,"name":"npm","user":"npm","password":"ci-mysql-password","shared":false,"ssl":{"enabled":false,"rejectUnauthorized":true,"verifyIdentity":true}}'

          curl -fsS             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "{\"target\":$mysql_target}"             http://127.0.0.1:18081/api/database/test | jq -e '.ok == true'

          curl -fsS             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "{\"target\":$mysql_target,\"operation\":\"migrate\",\"confirmation\":\"MIGRATE\"}"             http://127.0.0.1:18081/api/database/migrate | jq -e '.ok == true'

          for _ in $(seq 1 90); do
            if docker exec npmi-migrate /usr/bin/check-health >/dev/null 2>&1; then
              engine="$(curl -fsS -H "Authorization: Bearer $token"                 http://127.0.0.1:18081/api/database/status | jq -r '.engine' || true)"
              if [ "$engine" = "mysql" ]; then
                break
              fi
            fi
            sleep 2
          done

          test "$(curl -fsS -H "Authorization: Bearer $token"             http://127.0.0.1:18081/api/database/status | jq -r '.engine')" = "mysql"

          mysql_users="$(docker compose -f compose.mysql.yaml exec -T db             mariadb -unpm -pci-mysql-password npm -Nse 'SELECT COUNT(*) FROM user')"
          test "$mysql_users" -ge 1

          sqlite_target='{"engine":"sqlite","filename":"/data/roundtrip.sqlite"}'

          curl -fsS             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "{\"target\":$sqlite_target}"             http://127.0.0.1:18081/api/database/test | jq -e '.ok == true'

          curl -fsS             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d "{\"target\":$sqlite_target,\"operation\":\"migrate\",\"confirmation\":\"MIGRATE\"}"             http://127.0.0.1:18081/api/database/migrate | jq -e '.ok == true'

          for _ in $(seq 1 90); do
            if docker exec npmi-migrate /usr/bin/check-health >/dev/null 2>&1; then
              engine="$(curl -fsS -H "Authorization: Bearer $token"                 http://127.0.0.1:18081/api/database/status | jq -r '.engine' || true)"
              if [ "$engine" = "sqlite" ]; then
                break
              fi
            fi
            sleep 2
          done

          test "$(curl -fsS -H "Authorization: Bearer $token"             http://127.0.0.1:18081/api/database/status | jq -r '.engine')" = "sqlite"
          docker exec npmi-migrate node --input-type=module -e             "import Database from 'better-sqlite3'; const d=new Database('/data/roundtrip.sqlite',{readonly:true}); const n=d.prepare('SELECT COUNT(*) AS count FROM user').get().count; if(n<1) process.exit(1); console.log(n);"

          docker rm -f npmi-migrate

          docker compose -f compose.mysql.yaml exec -T db             mariadb -uroot -pci-mysql-root-password -e             "DROP DATABASE npm; CREATE DATABASE npm; GRANT ALL PRIVILEGES ON npm.* TO 'npm'@'%'; FLUSH PRIVILEGES;"

      - name: Smoke test Shared MySQL with two NPMi nodes
        run: |
          set -Eeuo pipefail

          mkdir -p data/nginx/custom letsencrypt
          cat > data/database-config.json <<'JSON'
          {
            "version": 1,
            "database": {
              "engine": "mysql2",
              "host": "db",
              "port": 3306,
              "user": "npm",
              "password": "ci-mysql-password",
              "name": "npm",
              "ssl": false,
              "shared": true
            }
          }
          JSON
          cat > data/shared-database-node.json <<'JSON'
          {
            "version": 1,
            "node_id": "ci-primary",
            "node_name": "CI Primary",
            "role": "primary",
            "public_url": "",
            "last_applied_revision": 0,
            "initialized": false,
            "last_error": null
          }
          JSON
          printf '%s\n' '# Shared MySQL replication smoke test' > data/nginx/custom/ci-shared.conf
          chmod 600 data/database-config.json data/shared-database-node.json

          docker compose -f compose.mysql.yaml up -d --no-build

          primary_id="$(docker compose -f compose.mysql.yaml ps -q app)"
          for _ in $(seq 1 90); do
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$primary_id")"
            if [ "$state" = "healthy" ]; then
              break
            fi
            if [ "$state" = "unhealthy" ] || [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              docker compose -f compose.mysql.yaml logs app
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$primary_id")" = "healthy"

          docker compose -f compose.mysql.yaml exec -T db             mariadb -unpm -pci-mysql-password npm -Nse             "SELECT COUNT(*) FROM npmi_shared_state WHERE id=1" | grep -qx '1'

          mkdir -p ci-secondary/data ci-secondary/letsencrypt
          cat > ci-secondary/data/database-config.json <<'JSON'
          {
            "version": 1,
            "database": {
              "engine": "mysql2",
              "host": "db",
              "port": 3306,
              "user": "npm",
              "password": "ci-mysql-password",
              "name": "npm",
              "ssl": false,
              "shared": true
            }
          }
          JSON
          cat > ci-secondary/data/shared-database-node.json <<'JSON'
          {
            "version": 1,
            "node_id": "ci-secondary",
            "node_name": "CI Secondary",
            "role": "secondary",
            "public_url": "",
            "last_applied_revision": 0,
            "initialized": false,
            "last_error": null
          }
          JSON
          chmod 600 ci-secondary/data/database-config.json ci-secondary/data/shared-database-node.json

          docker run -d             --name npmi-secondary             --network npm-improved_default             -v "$PWD/ci-secondary/data:/data"             -v "$PWD/ci-secondary/letsencrypt:/etc/letsencrypt"             npm-improved:local

          for _ in $(seq 1 90); do
            if docker exec npmi-secondary /usr/bin/check-health >/dev/null 2>&1; then
              break
            fi
            state="$(docker inspect --format '{{.State.Status}}' npmi-secondary)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              docker logs npmi-secondary
              exit 1
            fi
            sleep 2
          done
          docker exec npmi-secondary /usr/bin/check-health

          test -f ci-secondary/data/nginx/custom/ci-shared.conf
          grep -Fq 'Shared MySQL replication smoke test' ci-secondary/data/nginx/custom/ci-shared.conf

          primary_keys="$(sha256sum data/keys.json | awk '{print $1}')"
          secondary_keys="$(sha256sum ci-secondary/data/keys.json | awk '{print $1}')"
          test "$primary_keys" = "$secondary_keys"

          node_count="$(docker compose -f compose.mysql.yaml exec -T db             mariadb -unpm -pci-mysql-password npm -Nse             "SELECT COUNT(*) FROM npmi_shared_node WHERE node_id IN ('ci-primary','ci-secondary')")"
          test "$node_count" -eq 2

          secondary_role="$(docker compose -f compose.mysql.yaml exec -T db             mariadb -unpm -pci-mysql-password npm -Nse             "SELECT role FROM npmi_shared_node WHERE node_id='ci-secondary'")"
          test "$secondary_role" = "secondary"

      - name: Database smoke diagnostics
        if: failure()
        run: |
          docker compose -f compose.mysql.yaml ps || true
          docker compose -f compose.mysql.yaml logs --tail=250 || true
          docker logs --tail=250 npmi-migrate || true
          docker logs --tail=250 npmi-secondary || true

      - name: Stop database smoke stack
        if: always()
        run: |
          docker rm -f npmi-migrate >/dev/null 2>&1 || true
          docker rm -f npmi-secondary >/dev/null 2>&1 || true
          docker compose -f compose.mysql.yaml down -v --remove-orphans || true
