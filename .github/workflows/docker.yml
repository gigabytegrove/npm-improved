name: Docker

on:
  pull_request:
    branches:
      - develop
    paths:
      - "docker/**"
      - "frontend/**"
      - "backend/**"
      - "controlplane/**"
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.example"
      - "DOCKER.md"
      - "scripts/install-docker"
      - "scripts/update-handoff.sh"
      - "scripts/install-host-updater"
      - "scripts/host-update-dispatch.py"
      - "scripts/host-update-maintenance.py"
      - "scripts/test_host_updater_maintenance.py"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - "docker/**"
      - "frontend/**"
      - "backend/**"
      - "controlplane/**"
      - "compose*.yaml"
      - ".dockerignore"
      - ".env.example"
      - "DOCKER.md"
      - "scripts/install-docker"
      - "scripts/update-handoff.sh"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare validation environment
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-mysql-password/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-mysql-root-password/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=18080/' .env
          sed -i 's/^ADMIN_PORT=.*/ADMIN_PORT=18081/' .env
          sed -i 's/^HTTPS_PORT=.*/HTTPS_PORT=18443/' .env

      - name: Validate installer shell
        run: |
          bash -n scripts/install-docker
          sh -n scripts/update-handoff.sh
          bash -n scripts/install-host-updater
          python3 -m py_compile scripts/host-update-dispatch.py
          python3 -m py_compile scripts/host-update-maintenance.py
          python3 -m unittest discover -s scripts -p "test_host_updater_maintenance.py"

      - name: Ensure updater never creates a helper container
        run: |
          if grep -E 'docker:27-cli|/containers/create\?name=|ensureHelperImage' backend/internal/update-manager.js; then
            echo "Secondary updater containers are forbidden."
            exit 1
          fi
          test -f scripts/host-update-dispatch.py
          test -f scripts/host-update-maintenance.py
          test -f scripts/install-host-updater

      - name: Validate installer preflight
        run: ./scripts/install-docker sqlite --check-only

      - name: Validate SQLite Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Validate MariaDB Compose
        run: docker compose -f compose.mysql.yaml config --quiet

      - name: Validate PostgreSQL Compose
        run: docker compose -f compose.postgres.yaml config --quiet

      - name: Build production image
        run: docker build --pull --progress=plain -f docker/Dockerfile -t npm-improved:ci .

      - name: Verify native in-place Update manager restart
        shell: bash
        run: |
          set -Eeuo pipefail

          cp .env /tmp/npmi-update-test.env
          cleanup() {
            docker compose -f compose.yaml --env-file .env down --remove-orphans >/dev/null 2>&1 || true
            sudo rm -rf ./data ./letsencrypt
            cp /tmp/npmi-update-test.env .env || true
            rm -f /tmp/npmi-update-test.env
          }
          trap cleanup EXIT

          docker tag npm-improved:ci npm-improved:local
          mkdir -p data letsencrypt
          chmod 0777 data letsencrypt
          sed -i "s|^NPM_HOST_PROJECT_DIR=.*|NPM_HOST_PROJECT_DIR=$GITHUB_WORKSPACE|" .env
          sed -i 's|^NPM_DEPLOYMENT_MODE=.*|NPM_DEPLOYMENT_MODE=sqlite|' .env
          sed -i 's|^NPM_IMAGE=.*|NPM_IMAGE=npm-improved:local|' .env
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=19180/' .env
          sed -i 's/^ADMIN_PORT=.*/ADMIN_PORT=19181/' .env
          sed -i 's/^HTTPS_PORT=.*/HTTPS_PORT=19443/' .env
          sed -i 's/^INITIAL_ADMIN_EMAIL=.*/INITIAL_ADMIN_EMAIL=update-ci@example.com/' .env
          sed -i 's/^INITIAL_ADMIN_PASSWORD=.*/INITIAL_ADMIN_PASSWORD=update-ci-password-12345/' .env

          # Exercise the real first-install path. It installs a host service
          # and a versioned maintenance timer; never creates helper containers.
          sudo ./scripts/install-host-updater "$GITHUB_WORKSPACE"
          HASH="$(printf %s "$GITHUB_WORKSPACE" | sha256sum | cut -c1-12)"
          systemctl is-active --quiet "npm-improved-update-$HASH.path"
          systemctl is-active --quiet "npm-improved-update-$HASH-maintenance.timer"
          jq -e '.component_version == "1.5.0" and .maintenance == "automatic"' \
            data/host-updater-ready.json

          NPM_BUILD_VERSION=1.4.1-ci \
          NPM_BUILD_COMMIT="$GITHUB_SHA" \
          NPM_BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            docker compose -f compose.yaml --env-file .env up -d --no-build app

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:19181/api/ >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 90 ]; then docker compose -f compose.yaml logs app; exit 1; fi
            sleep 1
          done

          TOKEN="$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"identity":"update-ci@example.com","secret":"update-ci-password-12345"}' \
            http://127.0.0.1:19181/api/tokens | jq -r '.token')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:19181/api/version/update | jq -e '
            .capabilities.enabled == true and
            .capabilities.handoff_source == "native-host-service" and
            .capabilities.helper_image == null and
            .capabilities.host_service_installed == true
          '

          # Traffic intelligence + active deny: API must enforce a rule in
          # Nginx, NOT merely store/display a row in Analytics Center.
          BLOCK_ID="$(curl --fail-with-body -sS -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"type":"user_agent","target":"CI-Blocked-Agent-999","note":"integration test"}' \
            http://127.0.0.1:19181/api/analytics/blocks | jq -r '.id')"
          test -n "$BLOCK_ID" && test "$BLOCK_ID" != "null"
          CODE="000"
          for attempt in $(seq 1 12); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'CI-Blocked-Agent-999' http://127.0.0.1:19180/)"
            if [ "$CODE" = "403" ]; then break; fi
            sleep 0.25
          done
          echo "Blocked-user-agent HTTP status: $CODE"
          if [ "$CODE" != "403" ]; then
            echo "===== ACTIVE ANALYTICS BLOCK POLICY ====="
            sudo cat data/nginx/analytics/blocked-ua-rules.conf || true
            echo "===== GENERATED NGINX SERVER DIRECTIVES ====="
            docker exec npm-improved-app-1 nginx -T 2>&1 | grep -E 'npmi_analytics_block|blocked-ua|analytics' | tail -n 60 || true
            echo "===== CONTAINER LOGS ====="
            docker compose -f compose.yaml logs --tail 80 app || true
            exit 1
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:19181/api/analytics/blocks" \
            | jq -e --arg id "$BLOCK_ID" '.rules | any(.id == ($id|tonumber))'
          curl --fail-with-body -sS -X DELETE -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:19181/api/analytics/blocks/$BLOCK_ID" \
            | jq -e '.target == "CI-Blocked-Agent-999"'
          CODE="403"
          for attempt in $(seq 1 16); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'CI-Blocked-Agent-999' http://127.0.0.1:19180/)"
            if [ "$CODE" != "403" ]; then break; fi
            sleep 0.25
          done
          echo "Unblocked-user-agent HTTP status: $CODE"
          if [ "$CODE" = "403" ]; then
            echo "===== POLICY AFTER REMOVE ====="
            sudo cat data/nginx/analytics/blocked-ua-rules.conf || true
            echo "===== NGINX RULE CONFIG ====="
            docker exec npm-improved-app-1 nginx -T 2>&1 | grep -E 'npmi_analytics_block|blocked-ua|CI-Blocked-Agent-999' | tail -n 60 || true
            echo "===== APP LOGS ====="
            docker compose -f compose.yaml logs --tail 80 app || true
            exit 1
          fi

          curl -fsS -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"password":"update-ci-password-12345"}' \
            -X POST http://127.0.0.1:19181/api/version/update/restart \
            >/tmp/npmi-update-restart.json

          test -s data/host-update-request.json
          sudo "/usr/local/libexec/npm-improved/$HASH/host-update-dispatch.py" "$GITHUB_WORKSPACE"

          RESULT="$(curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:19181/api/version/update)"
          jq -e '.status.state == "completed"' <<<"$RESULT"
          test ! -e data/host-update-request.json
          test -z "$(docker ps -aq --filter label=com.gigabytegrove.npm-improved.role=update-handoff)"
          echo "PASS: restart completed through native host worker without helper containers."

          trap - EXIT
          cleanup

      - name: Verify NPMX pairing and node-local default-site sync
        shell: bash
        run: |
          set -euo pipefail

          cleanup_npmx() {
            docker rm -f npmi-npmx-primary npmi-npmx-secondary >/dev/null 2>&1 || true
            docker network rm npmi-npmx >/dev/null 2>&1 || true
            sudo rm -rf /tmp/npmi-npmx
          }
          dump_npmx_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== NPMX PRIMARY LOGS ====="
              docker logs npmi-npmx-primary 2>&1 || true
              echo "===== NPMX SECONDARY LOGS ====="
              docker logs npmi-npmx-secondary 2>&1 || true
            fi
            cleanup_npmx
            exit "$status"
          }
          trap dump_npmx_failure EXIT
          cleanup_npmx

          docker network create npmi-npmx
          mkdir -p /tmp/npmi-npmx/primary/data /tmp/npmi-npmx/primary/letsencrypt /tmp/npmi-npmx/secondary/data /tmp/npmi-npmx/secondary/letsencrypt
          chmod -R 0777 /tmp/npmi-npmx

          docker run -d --name npmi-npmx-primary --hostname npmi-primary --network npmi-npmx             -p 19280:80 -p 19281:81             -e DB_SQLITE_FILE=/data/database.sqlite             -e INITIAL_ADMIN_EMAIL=primary@example.com             -e INITIAL_ADMIN_PASSWORD=primary-password-12345             -e NPM_BUILD_VERSION=1.1.0-ci             -v /tmp/npmi-npmx/primary/data:/data             -v /tmp/npmi-npmx/primary/letsencrypt:/etc/letsencrypt             npm-improved:ci

          docker run -d --name npmi-npmx-secondary --hostname npmi-secondary --network npmi-npmx             -p 19380:80 -p 19381:81             -e DB_SQLITE_FILE=/data/database.sqlite             -e INITIAL_ADMIN_EMAIL=secondary@example.com             -e INITIAL_ADMIN_PASSWORD=secondary-password-12345             -e NPM_BUILD_VERSION=1.1.0-ci             -v /tmp/npmi-npmx/secondary/data:/data             -v /tmp/npmi-npmx/secondary/letsencrypt:/etc/letsencrypt             npm-improved:ci

          for port in 19281 19381; do
            for attempt in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/api/" >/dev/null 2>&1; then break; fi
              if [ "$attempt" -eq 90 ]; then
                docker logs npmi-npmx-primary || true
                docker logs npmi-npmx-secondary || true
                exit 1
              fi
              sleep 1
            done
          done

          PRIMARY_TOKEN="$(curl -fsS -H 'Content-Type: application/json'             -d '{"identity":"primary@example.com","secret":"primary-password-12345"}'             http://127.0.0.1:19281/api/tokens | jq -r '.token')"
          SECONDARY_TOKEN="$(curl -fsS -H 'Content-Type: application/json'             -d '{"identity":"secondary@example.com","secret":"secondary-password-12345"}'             http://127.0.0.1:19381/api/tokens | jq -r '.token')"

          curl -fsS -H "Authorization: Bearer $PRIMARY_TOKEN" -H 'Content-Type: application/json' -X PUT             -d '{"enabled":true,"node_name":"Primary A","role":"primary","public_url":"http://npmi-npmx-primary:81","interval_seconds":15}'             http://127.0.0.1:19281/api/cluster/settings             | jq -e '.enabled == true and .role == "primary" and .secretConfigured == true'

          curl -fsS -H "Authorization: Bearer $SECONDARY_TOKEN" -H 'Content-Type: application/json' -X PUT             -d '{"enabled":false,"node_name":"Secondary B","role":"secondary","public_url":"http://npmi-npmx-secondary:81","interval_seconds":15}'             http://127.0.0.1:19381/api/cluster/settings             | jq -e '.role == "secondary" and .secretConfigured == false'

          PAIR_CODE="$(curl -fsS -H "Authorization: Bearer $PRIMARY_TOKEN" -H 'Content-Type: application/json'             -d '{"primary_url":"http://npmi-npmx-primary:81"}'             http://127.0.0.1:19281/api/cluster/npmx/pairing-code | jq -r '.pairingCode')"
          grep -Eq '^npmx1\.' <<<"$PAIR_CODE"

          curl -fsS -H "Authorization: Bearer $SECONDARY_TOKEN" -H 'Content-Type: application/json'             -d "$(jq -nc --arg code "$PAIR_CODE" '{pairing_code:$code}')"             http://127.0.0.1:19381/api/cluster/npmx/join             | jq -e '.ok == true and .protocol == "npmx" and .status.role == "secondary" and .status.secretConfigured == true'

          test "$(sudo sha256sum /tmp/npmi-npmx/primary/data/cluster-secret | awk '{print $1}')" =                "$(sudo sha256sum /tmp/npmi-npmx/secondary/data/cluster-secret | awk '{print $1}')"

          curl -fsS -H "Authorization: Bearer $PRIMARY_TOKEN" -H 'Content-Type: application/json' -X PUT             -d '{"value":"html","meta":{"html":"<!doctype html><html><body><h1>{{node.name}}</h1><p>{{node.hostname}}</p><p>{{node.role}} / {{node.version}} / {{cluster.protocol}}/{{cluster.protocol_version}}</p></body></html>"}}'             http://127.0.0.1:19281/api/settings/default-site             | jq -e '.value == "html"'

          SYNC_RESULT="$(curl --fail-with-body -sS -H "Authorization: Bearer $SECONDARY_TOKEN" -X POST             http://127.0.0.1:19381/api/cluster/sync-now)"
          echo "$SYNC_RESULT"
          jq -e '.ok == true and .primary.protocol == "npmx"' <<<"$SYNC_RESULT"

          PRIMARY_PAGE=""
          SECONDARY_PAGE=""
          for attempt in $(seq 1 20); do
            PRIMARY_PAGE="$(curl -fsS http://127.0.0.1:19280/)"
            SECONDARY_PAGE="$(curl -fsS http://127.0.0.1:19380/)"
            if grep -Fq 'Primary A' <<<"$PRIMARY_PAGE" && grep -Fq 'Secondary B' <<<"$SECONDARY_PAGE"; then
              break
            fi
            sleep 0.5
          done
          echo "===== PRIMARY DEFAULT SITE ====="
          echo "$PRIMARY_PAGE"
          echo "===== SECONDARY DEFAULT SITE ====="
          echo "$SECONDARY_PAGE"
          grep -Fq 'Primary A' <<<"$PRIMARY_PAGE"
          grep -Fq 'npmi-primary' <<<"$PRIMARY_PAGE"
          grep -Fq 'primary / 1.1.0-ci / NPMX/1' <<<"$PRIMARY_PAGE"
          grep -Fq 'Secondary B' <<<"$SECONDARY_PAGE"
          grep -Fq 'npmi-secondary' <<<"$SECONDARY_PAGE"
          grep -Fq 'secondary / 1.1.0-ci / NPMX/1' <<<"$SECONDARY_PAGE"
          ! grep -Fq 'Primary A' <<<"$SECONDARY_PAGE"

          sudo cat /tmp/npmi-npmx/primary/data/npmx-pairing.json | jq -e '.used == true and (.paired_node_id | length > 0)'

          trap - EXIT
          cleanup_npmx

      - name: Verify UI database migration SQLite → MySQL → SQLite
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f npmi-db-wizard-app npmi-db-wizard-mysql >/dev/null 2>&1 || true
            docker network rm npmi-db-wizard >/dev/null 2>&1 || true
            sudo rm -rf /tmp/npmi-db-wizard
          }
          dump_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== DATABASE WIZARD APP LOGS ====="
              docker logs npmi-db-wizard-app 2>&1 || true
              echo "===== DATABASE WIZARD MYSQL LOGS ====="
              docker logs npmi-db-wizard-mysql 2>&1 || true
            fi
            cleanup
            exit "$status"
          }
          trap dump_failure EXIT

          docker network create npmi-db-wizard

          docker run -d \
            --name npmi-db-wizard-mysql \
            --network npmi-db-wizard \
            -e MARIADB_DATABASE=npmi_target \
            -e MARIADB_USER=npmi \
            -e MARIADB_PASSWORD=ci-database-password \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            public.ecr.aws/docker/library/mariadb:11

          for attempt in $(seq 1 60); do
            if docker exec npmi-db-wizard-mysql mariadb-admin ping -h127.0.0.1 -uroot -pci-root-password --silent >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs npmi-db-wizard-mysql
              exit 1
            fi
            sleep 1
          done

          mkdir -p /tmp/npmi-db-wizard/data /tmp/npmi-db-wizard/letsencrypt
          chmod 0777 /tmp/npmi-db-wizard/data /tmp/npmi-db-wizard/letsencrypt

          docker run -d \
            --name npmi-db-wizard-app \
            --network npmi-db-wizard \
            -p 19081:81 \
            -e DB_SQLITE_FILE=/data/database.sqlite \
            -e INITIAL_ADMIN_EMAIL=ci@example.com \
            -e INITIAL_ADMIN_PASSWORD=ci-password-12345 \
            -e NPM_BUILD_VERSION=1.1.0-ci \
            -v /tmp/npmi-db-wizard/data:/data \
            -v /tmp/npmi-db-wizard/letsencrypt:/etc/letsencrypt \
            npm-improved:ci

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:19081/api/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs npmi-db-wizard-app
              exit 1
            fi
            sleep 1
          done

          TOKEN="$(
            curl -fsS \
              -H 'Content-Type: application/json' \
              -d '{"identity":"ci@example.com","secret":"ci-password-12345"}' \
              http://127.0.0.1:19081/api/tokens | jq -r '.token'
          )"
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"engine":"mysql","shared":true,"mysql":{"host":"npmi-db-wizard-mysql","port":3306,"user":"npmi","password":"ci-database-password","name":"npmi_target","ssl":false}}' \
            http://127.0.0.1:19081/api/database/test | jq -e '.ok == true'

          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"engine":"mysql","shared":true,"mysql":{"host":"npmi-db-wizard-mysql","port":3306,"user":"npmi","password":"ci-database-password","name":"npmi_target","ssl":false},"confirmation":"MIGRATE"}' \
            http://127.0.0.1:19081/api/database/migrate | jq -e '.ok == true and .restartScheduled == true'

          for attempt in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:19081/api/database/status 2>/dev/null || true)"
            if [ -n "$STATUS" ] && [ "$(jq -r '.current.engine // empty' <<<"$STATUS")" = "mysql" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "$STATUS"
              docker logs npmi-db-wizard-app
              exit 1
            fi
            sleep 1
          done

          USER_COUNT="$(
            docker exec npmi-db-wizard-mysql \
              mariadb -N -B -unpmi -pci-database-password npmi_target \
              -e 'SELECT COUNT(*) FROM user;'
          )"
          test "$USER_COUNT" = "1"

          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"engine":"sqlite","sqlite":{"filename":"/data/database.sqlite"}}' \
            http://127.0.0.1:19081/api/database/test | jq -e '.ok == true'

          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"engine":"sqlite","sqlite":{"filename":"/data/database.sqlite"},"replace_target":true,"confirmation":"MIGRATE"}' \
            http://127.0.0.1:19081/api/database/migrate | jq -e '.ok == true and .restartScheduled == true'

          for attempt in $(seq 1 60); do
            STATUS="$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:19081/api/database/status 2>/dev/null || true)"
            if [ -n "$STATUS" ] && [ "$(jq -r '.current.engine // empty' <<<"$STATUS")" = "sqlite" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "$STATUS"
              docker logs npmi-db-wizard-app
              exit 1
            fi
            sleep 1
          done

          test "$(jq -r '.current.engine' <<<"$STATUS")" = "sqlite"
