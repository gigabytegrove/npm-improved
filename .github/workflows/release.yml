name: Release

on:
  push:
    branches:
      - develop
    paths:
      - ".version"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: npm-improved-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable image and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < .version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid .version value: $VERSION" >&2
            exit 1
          fi

          BACKEND_VERSION="$(node -p "require('./backend/package.json').version")"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"

          if [[ "$BACKEND_VERSION" != "$VERSION" ]]; then
            echo "backend/package.json version $BACKEND_VERSION does not match $VERSION" >&2
            exit 1
          fi

          if [[ "$FRONTEND_VERSION" != "$VERSION" ]]; then
            echo "frontend/package.json version $FRONTEND_VERSION does not match $VERSION" >&2
            exit 1
          fi

          NOTES=".github/release-notes/v${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Existing release
        if: steps.version.outputs.release_exists == 'true'
        run: echo "v${{ steps.version.outputs.version }} already exists; no release work is required."

      - name: Set up QEMU
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable multi-architecture image
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/gigabytegrove/npm-improved:v${{ steps.version.outputs.version }}
            ghcr.io/gigabytegrove/npm-improved:${{ steps.version.outputs.version }}
            ghcr.io/gigabytegrove/npm-improved:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect GHCR package visibility
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api /orgs/gigabytegrove/packages/container/npm-improved --jq '.visibility' 2>/dev/null || echo unknown)"
          echo "GitHub API reports container package visibility: $VISIBILITY"

      - name: Build public GitHub Release update bundles
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          IMAGE="ghcr.io/gigabytegrove/npm-improved:${TAG}"
          OUT="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$OUT"

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null

          for ARCH in amd64 arm64; do
            ASSET="npm-improved-${TAG}-linux-${ARCH}.tar.gz"
            docker pull --platform "linux/${ARCH}" "$IMAGE"
            docker save "$IMAGE" | gzip -1 > "$OUT/$ASSET"
            test -s "$OUT/$ASSET"
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          done

          (
            cd "$OUT"
            sha256sum npm-improved-${TAG}-linux-*.tar.gz > "npm-improved-${TAG}-SHA256SUMS.txt"
          )

          ls -lh "$OUT"

      - name: Test anonymous GHCR pull
        if: steps.version.outputs.release_exists != 'true'
        id: anonymous
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/gigabytegrove/npm-improved:v${VERSION}"

          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$IMAGE" >/dev/null 2>&1 || true

          if PULL_OUTPUT="$(docker pull "$IMAGE" 2>&1)"; then
            echo "$PULL_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Anonymous GHCR pull succeeded."
          else
            echo "$PULL_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Anonymous GHCR pull is unavailable. This release remains installable through the verified public GitHub Release image bundle fallback."
          fi

      - name: Publish GitHub release and update bundles
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "NPM Improved $TAG"             --notes-file "$NOTES"             release-assets/*

      - name: Verify public GitHub Release fallback
        if: steps.version.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          SUMS="npm-improved-${TAG}-SHA256SUMS.txt"
          URL="https://github.com/gigabytegrove/npm-improved/releases/download/${TAG}/${SUMS}"

          for attempt in $(seq 1 12); do
            if curl -fsSL --range 0-64 "$URL" >/dev/null; then
              echo "Public GitHub Release update bundle channel is available."
              exit 0
            fi
            sleep 5
          done

          echo "::error::The public GitHub Release update bundle channel could not be verified."
          exit 1
