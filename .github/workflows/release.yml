name: Release

on:
  push:
    branches:
      - develop
    paths:
      - ".version"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: npm-improved-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable image and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < .version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid .version value: $VERSION" >&2
            exit 1
          fi

          BACKEND_VERSION="$(node -p "require('./backend/package.json').version")"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"

          if [[ "$BACKEND_VERSION" != "$VERSION" ]]; then
            echo "backend/package.json version $BACKEND_VERSION does not match $VERSION" >&2
            exit 1
          fi

          if [[ "$FRONTEND_VERSION" != "$VERSION" ]]; then
            echo "frontend/package.json version $FRONTEND_VERSION does not match $VERSION" >&2
            exit 1
          fi

          NOTES=".github/release-notes/v${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          # A one-time explicitly titled merge reissues the same semver with
          # all three security toolchains; ordinary releases stay immutable.
          REISSUE=false
          if [[ "$VERSION" == "1.6.14" && "$(git log -1 --pretty=%s)" == "release: consolidate v1.6.14 security baseline" ]]; then
            REISSUE=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1 && [[ "$REISSUE" != "true" ]]; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          echo "reissue=$REISSUE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Existing release
        if: steps.version.outputs.release_exists == 'true'
        run: echo "v${{ steps.version.outputs.version }} already exists; no release work is required."

      - name: Set up QEMU
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable multi-architecture image
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/gigabytegrove/npm-improved:v${{ steps.version.outputs.version }}
            ghcr.io/gigabytegrove/npm-improved:${{ steps.version.outputs.version }}
            ghcr.io/gigabytegrove/npm-improved:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect GHCR package visibility
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api /orgs/gigabytegrove/packages/container/npm-improved --jq '.visibility' 2>/dev/null || echo unknown)"
          echo "GitHub API reports container package visibility: $VISIBILITY"

      - name: Build public GitHub Release update bundles
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          IMAGE="ghcr.io/gigabytegrove/npm-improved:${TAG}"
          OUT="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$OUT"

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null

          for ARCH in amd64 arm64; do
            ASSET="npm-improved-${TAG}-linux-${ARCH}.tar.gz"
            docker pull --platform "linux/${ARCH}" "$IMAGE"
            DOCKER_DEFAULT_PLATFORM="linux/${ARCH}" bash scripts/ci/assert-nginx-security "$IMAGE"
            docker save "$IMAGE" | gzip -1 > "$OUT/$ASSET"
            test -s "$OUT/$ASSET"
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          done

          # Native host runner lifecycle is distributed with every release.
          # No helper image is needed: the host verifies and upgrades itself.
          tar -czf "$OUT/npm-improved-${TAG}-host-updater.tar.gz" \
            scripts/install-host-updater \
            scripts/host-update-dispatch.py \
            scripts/host-update-maintenance.py \
            scripts/update-handoff.sh \
            .version

          (
            cd "$OUT"
            sha256sum npm-improved-${TAG}-linux-*.tar.gz \
              npm-improved-${TAG}-host-updater.tar.gz \
              > "npm-improved-${TAG}-SHA256SUMS.txt"
          )

          ls -lh "$OUT"

      - name: Test anonymous GHCR pull
        if: steps.version.outputs.release_exists != 'true'
        id: anonymous
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/gigabytegrove/npm-improved:v${VERSION}"

          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$IMAGE" >/dev/null 2>&1 || true

          if PULL_OUTPUT="$(docker pull "$IMAGE" 2>&1)"; then
            echo "$PULL_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Anonymous GHCR pull succeeded."
          else
            echo "$PULL_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Anonymous GHCR pull is unavailable. This release remains installable through the verified public GitHub Release image bundle fallback."
          fi

      - name: Publish GitHub release and update bundles
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if [[ "${{ steps.version.outputs.reissue }}" == "true" ]]; then
            # All multiarch images and checksum-verified bundles are built by
            # this point. Retarget the existing tag before replacing assets.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "NPM Improved $TAG" --notes-file "$NOTES" --latest
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "NPM Improved $TAG" --notes-file "$NOTES" release-assets/*
          fi

          # Never succeed unless ALL four assets exist under the consolidated version.
          for asset in "npm-improved-$TAG-host-updater.tar.gz" "npm-improved-$TAG-linux-amd64.tar.gz" "npm-improved-$TAG-linux-arm64.tar.gz" "npm-improved-$TAG-SHA256SUMS.txt"; do
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          echo "Verified complete release assets for $TAG"

      - name: Verify public GitHub Release fallback
        if: steps.version.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          SUMS="npm-improved-${TAG}-SHA256SUMS.txt"
          URL="https://github.com/gigabytegrove/npm-improved/releases/download/${TAG}/${SUMS}"

          for attempt in $(seq 1 12); do
            if curl -fsSL --range 0-64 "$URL" >/dev/null; then
              echo "Public GitHub Release update bundle channel is available."
              exit 0
            fi
            sleep 5
          done

          echo "::error::The public GitHub Release update bundle channel could not be verified."
          exit 1

      - name: Remove superseded GitHub releases and tags
        if: steps.version.outputs.reissue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only do this AFTER public consolidated release and bundle checks.
          for old in v1.6.15 v1.6.16; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --yes --cleanup-tag
            else
              if git ls-remote --tags origin "refs/tags/$old" | grep -q .; then
                git push origin ":refs/tags/$old"
              fi
            fi
            if gh release view "$old" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$old" | grep -q .; then
              echo "FAIL: superseded release/tag remains: $old" >&2
              exit 1
            fi
            echo "Removed superseded GitHub release and git tag $old"
          done

      - name: Remove exclusive GHCR tags for superseded releases
        if: steps.version.outputs.reissue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          package="orgs/gigabytegrove/packages/container/npm-improved"
          if ! versions="$(gh api --paginate "$package/versions?per_page=100" --jq '.[] | {id: .id, tags: .metadata.container.tags}' 2>&1)"; then
            echo "::warning::Could not list GHCR package versions; old image tags require separately authorized removal: $versions"
            exit 0
          fi
          while IFS= read -r item; do
            [[ -n "$item" ]] || continue
            if ! echo "$item" | jq -e '.tags | any(. == "v1.6.15" or . == "1.6.15" or . == "v1.6.16" or . == "1.6.16")' >/dev/null; then
              continue
            fi
            version_id="$(echo "$item" | jq -r '.id')"
            unexpected="$(echo "$item" | jq -r '[.tags[]? | select(. != "v1.6.15" and . != "1.6.15" and . != "v1.6.16" and . != "1.6.16")] | join(",")')"
            if [[ -n "$unexpected" ]]; then
              echo "::warning::GHCR version $version_id has shared tags ($unexpected); will not delete unrelated tags."
              continue
            fi
            if gh api --method DELETE "$package/versions/$version_id"; then
              echo "Deleted superseded exclusive GHCR package version $version_id"
            else
              echo "::warning::Unable to delete GHCR package version $version_id with this token."
            fi
          done <<< "$versions"
