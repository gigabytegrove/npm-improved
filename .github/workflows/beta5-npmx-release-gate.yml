name: Beta 5 NPMX release gate

on:
  push:
    branches:
      - release/1.8.0-beta.5-npmx-identity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-improved-beta5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: NPMX regressions and backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22
      - name: Check release identity
        run: |
          test "$(cat .version)" = "1.8.0-beta.5"
          test "$(node -p "require('./backend/package.json').version")" = "1.8.0-beta.5"
          test "$(node -p "require('./frontend/package.json').version")" = "1.8.0-beta.5"
          test -s .github/release-notes/v1.8.0-beta.5.md
      - name: Check updater and publisher syntax
        run: |
          sh -n scripts/update-handoff.sh
          bash -n scripts/release/publish-firewall-beta5.sh
          python3 -m py_compile scripts/host-update-dispatch.py scripts/host-update-maintenance.py
      - name: Test snapshot identity and upgrade regressions
        run: |
          node --check backend/internal/disaster-recovery.js
          node --check backend/internal/instance-sync.js
          node --check backend/internal/update-manager.js
          node --check backend/index.js
          node --test backend/test/npmx-cluster-database.test.js backend/test/npmx-update-identity.test.js
      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Full backend tests
        working-directory: backend
        run: yarn test
      - name: Backend lint and schema
        working-directory: backend
        run: |
          yarn lint
          yarn validate-schema

  frontend:
    name: Frontend test and production compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Generate locale catalog
        working-directory: frontend
        run: yarn locale-compile
      - name: Router and firewall regression tests
        working-directory: frontend
        run: yarn vitest run src/Router.test.tsx src/pages/Settings/Firewall.test.ts src/modules/instanceFirewallVisibility.test.ts
      - name: Production frontend compile
        working-directory: frontend
        run: yarn build

  firewall:
    name: Firewall companion tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: Go unit tests
        working-directory: docker/firewall
        run: go test -v main.go main_test.go

  publish:
    name: Publish immutable beta.5 release after all gates pass
    needs: [backend, frontend, firewall]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/1.8.0-beta.5-npmx-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify release source before creating artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat .version)" = "1.8.0-beta.5"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s .github/release-notes/v1.8.0-beta.5.md
          if gh release view v1.8.0-beta.5 -R gigabytegrove/npm-improved >/dev/null 2>&1; then
            echo "Beta.5 already exists. Published release assets are immutable." >&2
            exit 1
          fi
      - name: Build, checksum and publish AMD64 and ARM64 release bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NPMI_BUILD_ROOT: ${{ runner.temp }}/npm-improved-build
        run: |
          set -euo pipefail
          bash scripts/release/publish-firewall-beta5.sh "$GITHUB_SHA"
