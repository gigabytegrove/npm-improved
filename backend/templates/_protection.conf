{% if protection_profile == "off" %}
  # NPM Improved Protection: Off for this host.
  # Empty-key zones intentionally override any inherited global rate/connection limits.
  limit_req zone=npm_protection_off burst=1 nodelay;
  limit_conn npm_protection_off_conn 1;
  client_header_timeout 60s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection off;
{% elsif protection_profile == "standard" %}
  # NPM Improved Protection: Standard
  limit_req zone=npm_protection_standard burst=60 nodelay;
  limit_conn npm_protection_conn 40;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;
  limit_conn_log_level warn;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  reset_timedout_connection on;
{% elsif protection_profile == "aggressive" %}
  # NPM Improved Protection: Aggressive
  limit_req zone=npm_protection_aggressive burst=20 nodelay;
  limit_conn npm_protection_conn 15;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;
  limit_conn_log_level warn;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 20s;
  reset_timedout_connection on;
{% else %}
  # NPM Improved Protection: Inherit global policy
{% endif %}
