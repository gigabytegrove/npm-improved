{% include "_header_comment.conf" %}

{% if enabled %}

{% if upstream_pool_enabled %}
upstream {{ upstream_name }} {
{% if upstream_mode == "least-conn" %}
  least_conn;
{% elsif upstream_mode == "ip-hash" %}
  ip_hash;
{% endif %}
{% for upstream in render_upstreams %}
  server {{ upstream.nginx_host }}:{{ upstream.port }} weight={{ upstream.weight }} max_fails={{ upstream.max_fails }} fail_timeout={{ upstream.fail_timeout }}s{% if upstream.backup %} backup{% endif %};
{% endfor %}
}
{% endif %}

{% include "_hsts_map.conf" %}

server {
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_protection.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    # Proxy!
{% if upstream_pool_enabled %}
    include conf.d/include/proxy-headers.conf;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries {{ upstream_count }};
{% if upstream_scheme == "https" %}
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
{% endif %}
    proxy_pass {{ upstream_scheme }}://{{ upstream_name }};
{% else %}
    include conf.d/include/proxy.conf;
{% endif %}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
