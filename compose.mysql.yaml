name: npm-improved

services:
  app:
    image: ${NPM_IMAGE:-npm-improved:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_VERSION: ${NPM_BUILD_VERSION:-local}
        BUILD_COMMIT: ${NPM_BUILD_COMMIT:-unknown}
        BUILD_DATE: ${NPM_BUILD_DATE:-unknown}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${ADMIN_PORT:-81}:81"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NPM_ADMIN_PORT: "81"
      NPM_HOST_PROJECT_DIR: ${NPM_HOST_PROJECT_DIR:-}
      NPM_DEPLOYMENT_MODE: ${NPM_DEPLOYMENT_MODE:-mysql}
      DISABLE_IPV6: ${DISABLE_IPV6:-false}
      DB_MYSQL_HOST: db
      DB_MYSQL_PORT: "3306"
      DB_MYSQL_NAME: ${MYSQL_DATABASE:-npm}
      DB_MYSQL_USER: ${MYSQL_USER:-npm}
      DB_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      NPM_BACKUP_PASSPHRASE: ${NPM_BACKUP_PASSPHRASE:-}
      NPM_BACKUP_SCOPE: ${NPM_BACKUP_SCOPE:-disaster-recovery}
      NPM_BACKUP_INTERVAL_HOURS: ${NPM_BACKUP_INTERVAL_HOURS:-24}
      NPM_BACKUP_RETENTION: ${NPM_BACKUP_RETENTION:-7}
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-npm}
      MARIADB_USER: ${MYSQL_USER:-npm}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
