<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NPM Improved</title>
	<style>
		:root { color-scheme: light dark; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
		main { width: min(680px, 100%); padding: 32px; border: 1px solid #334155; border-radius: 18px; background: #111827; box-shadow: 0 22px 60px rgba(0,0,0,.28); }
		h1 { margin: 0 0 12px; letter-spacing: -.035em; }
		p { margin: 0; color: #cbd5e1; line-height: 1.6; }
	</style>
</head>
<body>
	<main>
		<h1>NPM Improved</h1>
		<p>This hostname is not assigned to a configured Proxy Host. Sign in to the NPM Improved Control Center to configure it.</p>
	</main>
</body>
</html>
