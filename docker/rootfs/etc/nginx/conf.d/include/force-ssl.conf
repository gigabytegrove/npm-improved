set $test "";
if ($scheme = "http") {
	set $test "H";
}
# All HTTP-01 tokens must be delivered over HTTP even for forced-HTTPS hosts.\n# Keep the exception scoped to a syntactically valid token path only.\nif ($uri ~ "^/\\.well-known/acme-challenge/[A-Za-z0-9_-]{1,128}$") {\n\tset $test "${test}T";\n}

# Check if the ssl staff has been handled
set $test_ssl_handled "";
if ($trust_forwarded_proto = "") {
	set $trust_forwarded_proto "F";
}
if ($trust_forwarded_proto = "T") {
	set $test_ssl_handled "${test_ssl_handled}T";
}
if ($http_x_forwarded_proto = "https") {
	set $test_ssl_handled "${test_ssl_handled}S";
}
if ($http_x_forwarded_scheme = "https") {
	set $test_ssl_handled "${test_ssl_handled}S";
}
if ($test_ssl_handled = "TSS") {
	set $test_ssl_handled "TS";
}
if ($test_ssl_handled = "TS") {
	set $test "${test}S";
}

if ($test = H) {
	return 301 https://$host$request_uri;
}
