# All NPMX nodes can answer HTTP-01 challenges, even when the requesting
# primary is a different node. The local backend resolves local challenge
# tokens first and relays missing tokens over signed NPMX transport.
location ^~ /.well-known/acme-challenge/ {
	auth_basic off;
	auth_request off;
	allow all;
	default_type "text/plain";
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	# Port 3000 serves Express at / (the public /api prefix is stripped by\n\t# the Nginx management listener). Do not include /api here.\n\tproxy_pass http://127.0.0.1:3000/cluster/acme/;
	proxy_connect_timeout 3s;
	proxy_read_timeout 8s;
	proxy_intercept_errors off;
	add_header Cache-Control "no-store" always;
}

location = /.well-known/acme-challenge/ {
	return 404;
}
