log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';

access_log /data/logs/fallback_http_access.log proxy;

# Dedicated privacy-conscious structured events for local per-host analytics.
# URI uses $uri rather than $request_uri: no query strings, cookies or headers.
log_format proxy_analytics escape=json '{"time":"$time_iso8601","domain":"$host","method":"$request_method","path":"$uri","protocol":"$server_protocol","status":"$status","bytes_sent":"$bytes_sent","request_length":"$request_length","request_time":"$request_time","upstream_time":"$upstream_response_time","upstream_status":"$upstream_status","user_agent":"$http_user_agent","client_ip":"$remote_addr","peer_ip":"$realip_remote_addr","request_id":"$request_id","connection_id":"$connection","connection_requests":"$connection_requests","epoch":"$msec","scheme":"$scheme","tls":"$ssl_protocol","blocked_ip":"$npmi_analytics_block_ip","blocked_ua":"$npmi_analytics_block_ua"}';
